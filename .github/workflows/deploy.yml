name: Deploy to Timeweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Timeweb redeploy
        run: |
          curl -s -o response.json -w "%{http_code}" \
            -X POST "https://api.timeweb.cloud/api/v1/apps/182121/deploy" \
            -H "Authorization: Bearer ${{ secrets.TW_API_TOKEN }}" \
            -H "Content-Type: application/json" > http_code.txt
          cat response.json
          CODE=$(cat http_code.txt)
          echo "HTTP status: $CODE"
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "Deploy triggered successfully"
          else
            echo "Deploy failed with status $CODE"
            exit 1
          fi
